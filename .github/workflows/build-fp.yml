name: 构建 FolkPatch 内核

on:
  workflow_dispatch:
    inputs:
      rekernel_branch:
        description: 'ReKernel-X分支'
        required: false
        default: main
        type: choice
        options:
          - upstream/main
          - upstream/v9.2
          - main
          - dev
  push:
    branches:
      - FolkPatch-Build

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: false

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git gnupg libssl-dev libelf-dev \
            cpio zip xz-utils wget python3 unzip

      - name: Setup Neutron Clang
        run: |
          mkdir -p toolchains/clang
          cd toolchains/clang
          curl -LO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
          chmod +x antman
          ./antman -S

      - name: Setup Re:Kernel (with git for auto-update)
        run: |
          rm -rf Re-Kernel
          git clone --depth=1 --tags -b ${{ inputs.rekernel_branch || 'main' }} https://github.com/myflavor/ReKernel-X.git Re-Kernel
          mkdir -p drivers/rekernel
          cp -f Re-Kernel/LKM-Source/rkx*.c drivers/rekernel/
          cp -f Re-Kernel/LKM-Source/rkx*.h drivers/rekernel/
          # 版本号规则: 发布分支main显示最新tag(如1.3), 无tag分支(dev等)显示commit hash
          RK_BRANCH="${{ inputs.rekernel_branch || 'main' }}"
          RKX_VER=$(cd Re-Kernel && git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//')
          if [ -z "$RKX_VER" ] && [ "$RK_BRANCH" = "main" ]; then
              RKX_VER=$(curl -sL 'https://api.github.com/repos/myflavor/ReKernel-X/tags' | grep -oP '"name":\s*"\K[^"]+' | head -1)
          fi
          if [ -z "$RKX_VER" ]; then
              RKX_VER=$(cd Re-Kernel && git rev-parse --short HEAD 2>/dev/null)
          fi
          RKX_VER=${RKX_VER:-unknown}
          sed 's/obj-m/obj-$(CONFIG_REKERNEL)/' Re-Kernel/LKM-Source/Makefile > drivers/rekernel/Makefile
          echo "ccflags-y += -DRKX_VERSION=\\\"r${RKX_VER}\\\"" >> drivers/rekernel/Makefile

      - name: Prepare ccache
        run: mkdir -p ~/.ccache

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: ~/.ccache
          key: ccache-fp-${{ github.ref_name }}
          restore-keys: ccache-fp-

      - name: Build kernel with FolkPatch
        run: |
          export PATH="$(pwd)/toolchains/clang/bin:/usr/lib/ccache:$PATH"
          export CCACHE_DIR=~/.ccache
          ccache -M 8G
          # 首次运行: 初始克隆ReKernel
          if [ ! -d Re-Kernel/.git ]; then
            rm -rf Re-Kernel
            git clone --depth=1 --tags -b ${{ inputs.rekernel_branch || 'main' }} https://github.com/myflavor/ReKernel-X.git Re-Kernel
          fi
          bash build.sh
          cp ~/Fuxi-FolkPatch-*.zip ./ 2>/dev/null || true

      - name: Set build info
        run: |
          echo "BUILD_NUM=${{ github.run_number }}" >> $GITHUB_ENV

      - name: Upload to Telegram
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          ZIP_FILE=$(ls Fuxi-FolkPatch-*.zip 2>/dev/null | head -1)
          if [ -z "$ZIP_FILE" ]; then
            echo "找不到 ZIP 文件，跳过上传"
            exit 0
          fi
          if [ -n "$TOKEN" ] && [ -n "$CHAT_ID" ]; then
            NL=$'\n'
            # 优先读实际下载的 FolkPatch versionCode(build.sh 从 APK 文件名提取),
            # 回退到 release tag, 不再读 FolkPatch main 分支(可能领先 release 一个版本)
            FP_VER=$(cat KernelPatch/fp_versioncode.txt 2>/dev/null || cat KernelPatch/fp_version.txt 2>/dev/null || echo "unknown")
            KP_VER=$(cat KernelPatch/kpimg.version 2>/dev/null || cat KernelPatch/kptools_version.txt 2>/dev/null || echo "unknown")
            # 版本号规则: 发布分支main显示最新tag(如1.3), 无tag分支(dev等)显示commit hash
            RK_BRANCH="${{ inputs.rekernel_branch || 'main' }}"
            RK_VER=$(cd Re-Kernel && git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//')
            if [ -z "$RK_VER" ] && [ "$RK_BRANCH" = "main" ]; then
                RK_VER=$(curl -sL 'https://api.github.com/repos/myflavor/ReKernel-X/tags' | grep -oP '"name":\s*"\K[^"]+' | head -1)
            fi
            if [ -z "$RK_VER" ]; then
                RK_VER=$(cd Re-Kernel && git rev-parse --short HEAD 2>/dev/null)
            fi
            RK_VER="${RK_VER:-unknown}@${RK_BRANCH}"
            CAPTION="✅ FolkPatch 内核编译完成${NL}✅ FolkPatch：${FP_VER}${NL}✅ KernelPatch：${KP_VER}${NL}✅ ReKernel-X: ${RK_VER}${NL}✅ BBR：V1${NL}✅ Lz4：1.10${NL}构建号: FolkPatch-${{ github.run_number }}"
            curl -s -F chat_id="$CHAT_ID" \
              -F document=@"$ZIP_FILE" \
              -F "caption=$CAPTION" \
              "https://api.telegram.org/bot${TOKEN}/sendDocument"
          else
            echo "Telegram upload skipped (missing token/chat_id)"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: FolkPatch-Kernel
          path: "Fuxi-FolkPatch-*.zip"
          if-no-files-found: error

      - name: Create Release
        if: success() && github.ref_name == 'FolkPatch-Build'
        run: |
          GH_TOKEN=${{ github.token }} gh release create FolkPatch-Build-${{ github.run_number }} Fuxi-FolkPatch-*.zip \
            --repo ${{ github.repository }} \
            --title "FolkPatch 内核 #${{ github.run_number }}" \
            --generate-notes